language: python

python:
  - "3.6"

branches:
  only:
    - master

-before_install:
  - sudo apt-get -qq -y update

install:
  - sudo apt-get install -y git pylint pep8 python-nose python-coverage pyflakes python-nosexcover
  - pip install PyQt5

before_script:
  - echo "Build starting on " `date`
  - export PYTHONPATH=`pwd`

script:
  - xvfb-run --server-args="-screen 0, 1024x768x24" nosetests -v --with-id --with-xunit --verbose --cover-package=parameters
  - make pep8

after_success:
  - pip install coveralls
  - coveralls

notifications:
  email:
    - ismail@kartoza.com